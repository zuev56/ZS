name: "vpn"

services:

  metube:
    image: ghcr.io/alexta69/metube:latest
    container_name: metube
    restart: unless-stopped
    volumes:
      - /mnt/firebat/metube:/downloads
      - /opt/metube/state:/state
    environment:
      - UID=1000
      - GID=1000
      - CHOWN_DIRS=false
      - UMASK=022
      - DOWNLOAD_DIR=/downloads
      - TEMP_DIR=/downloads
    ports:
      - 15888:8081
